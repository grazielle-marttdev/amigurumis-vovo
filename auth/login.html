<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Amigurumis da Vovó - Login</title>

    <link rel="stylesheet" href="../css/reset.css">
    <link rel="stylesheet" href="../css/variables.css">
    <link rel="stylesheet" href="../css/base.css">
    <link rel="stylesheet" href="../css/components.css">
    <link rel="stylesheet" href="../css/utilities.css">
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
</head>
<body>
    <dialog class="dialog-form">
        <form class="auth-form" id="login-form">
            <h1>Entrar</h1>

            <div class="form-group">
                <label for="email">Email</label>
                <input type="email" id="email" name="email" placeholder="Digite seu e-mail" required>
            </div>
    
            <div class="form-group">
                <label for="password">Senha</label>
                <input type="password" id="password" name="password" placeholder="Digite sua senha" required>
                <i class="fa-solid fa-eye hide"></i>
                <i class="fa-solid fa-eye-slash"></i>
            </div>
    
            <button type="submit" class="btn">Entrar</button>

            <div class="auth-footer">
                <a href="register.html">Criar uma conta</a>
                <a href="">Esqueceu a senha?</a>
            </div>
        </form>
    </dialog>

    <!-- Adiciona validação com JustValidate -->
    <script src="https://unpkg.com/just-validate@latest/dist/just-validate.production.min.js"></script>
    
    <script src="../js/auth/login.js"></script>
    <script src="../js/auth/password-visibility.js"></script>
</body>
</html>
